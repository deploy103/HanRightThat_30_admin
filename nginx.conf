# 컨테이너 내부 nginx 설정 (SPA fallback). 호스트의 리버스 프록시 설정과는 별개다 — 그건 deploy/nginx.conf.example 참고.
#
# 주의: nginx 는 location 블록에 자체 add_header 가 있으면 상위(server) 블록의
# add_header 를 상속하지 않는다. 그래서 보안 헤더를 매 location 블록마다 반복한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # connect-src 는 VITE_API_URL(빌드 시 주입되는 API 서버 도메인)과 반드시 일치해야 한다.
        # 운영 기본값은 https://hanwol.site — 다른 API 도메인을 쓰면 이 줄도 함께 바꿀 것.
        # img-src 에 API 도메인이 필요한 이유: 부스 대표 이미지 미리보기를 API 서버에서 직접 불러온다.
        # data: 는 2단계 인증 QR 코드(서버가 만든 data URL) 표시에 쓴다.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://hanwol.site; connect-src 'self' https://hanwol.site; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://hanwol.site; connect-src 'self' https://hanwol.site; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
